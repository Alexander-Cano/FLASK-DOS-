<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Profesor - Portal Clase 1114</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #667eea; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .footer { background-color: #343a40; color: white; padding: 20px 0; margin-top: 40px; text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/estudiantes">Ver Estudiantes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mis-tareas">Mis Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="min-height: 60vh;">
        <h1 class="mb-4">Panel del Profesor</h1>
        <div class="alert alert-primary shadow-sm" role="alert">
            Bienvenido, <strong>{{ usuario }}</strong>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title h5">Acciones del Profesor</h2>
                        <ul class="list-group list-group-flush mt-3">
                            <li class="list-group-item"><a href="/crear-tarea" class="text-decoration-none">Crear tareas</a></li>
                            <li class="list-group-item"><a href="/estudiantes" class="text-decoration-none">Ver estudiantes inscritos</a></li>
                            <li class="list-group-item">Poner calificaciones (Próximamente)</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portal Clase 1114 | Profesor: Henry Ortegon | Kyrbot Innovations</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
