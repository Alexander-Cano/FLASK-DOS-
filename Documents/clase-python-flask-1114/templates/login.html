<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Clase 1114</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #667eea; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .footer { background-color: #343a40; color: white; padding: 20px 0; margin-top: 40px; text-align: center; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Informacion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tareas">Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inscripcion">Inscripcion</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <h1 class="text-center mb-4">Login Portal Clase 1114</h1>
                
                {% if mensaje %}
                <div class="alert alert-danger shadow-sm text-center" role="alert">
                    {{ mensaje }}
                </div>
                {% endif %}

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form method="POST">
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-bold">Usuario:</label>
                                <input type="text" class="form-control" name="usuario" id="usuario" required>
                            </div>

                            <div class="mb-3">
                                <label for="contraseña" class="form-label fw-bold">Contraseña:</label>
                                <input type="password" class="form-control" name="contraseña" id="contraseña" required>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                    </div>
                </div>

                <hr class="mt-5">
                
                <div class="alert alert-info shadow-sm" role="alert">
                    <p class="mb-1">Datos de prueba:</p>
                    <p class="mb-0 small"><strong>Profesor:</strong> usuario=henry, contraseña=password123</p>
                </div>

            </div>
        </div>
    </div>

    <footer class="footer mt-auto">
        <div class="container">
            <p>&copy; 2026 Portal Clase 1114 | Profesor: Henry Ortegon | Kyrbot Innovations</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
